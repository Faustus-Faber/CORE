# Render Infrastructure-as-Code Blueprint for CORE
# See https://render.com/docs/blueprint-spec for details

services:
  # Backend Express API Web Service
  - type: web
    name: core-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: core-frontend
          property: url

  # Frontend React SPA Static Site
  - type: web
    name: core-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: core-backend
          property: url
          append: /api
